project: deblur_gan
experiment_desc: fpn_attention_full_run

train:
  files_a: &FILES_A ../dataset/train/blur/*.png
  files_b: ../dataset/train/sharp/*.png

  size: &SIZE 256
  crop: random

  preload: &PRELOAD false
  preload_size: &PRELOAD_SIZE 0

  # Use 100% of the training images (0.0 to 1.0)
  bounds: [0, 1]
  scope: geometric

  corrupt: &CORRUPT
    - name: cutout
      prob: 0.5
      num_holes: 3
      max_h_size: 25
      max_w_size: 25

    - name: jpeg
      quality_lower: 70
      quality_upper: 90

    - name: gamma
    - name: rgb_shift
    - name: hsv_shift
    - name: sharpen

val:
  files_a: ../dataset/val/blur/*.png
  files_b: ../dataset/val/sharp/*.png

  size: *SIZE
  scope: geometric
  crop: center

  preload: *PRELOAD
  preload_size: *PRELOAD_SIZE

  # Use 100% of the validation split (0.0 to 1.0)
  bounds: [0, 1]
  corrupt: *CORRUPT

phase: train
warmup_num: 2

model:
  g_name: fpn_inception
  blocks: 9

  d_name: double_gan
  d_layers: 3

  content_loss: perceptual
  adv_lambda: 0.001
  disc_loss: wgan-gp

  learn_residual: True
  norm_layer: instance
  dropout: True

# --- FULL TRAINING SETTINGS (Phase 6) ---
num_epochs: 100
# Commenting these two lines out (or setting to null) tells DeblurGAN-v2
# to iterate through every single image in your dataset per epoch.
# If you prefer fixed-length epochs, uncomment the two lines below:
# train_batches_per_epoch: 1000
# val_batches_per_epoch: 100

batch_size: 1
image_size: [256, 256]

optimizer:
  name: adam
  lr: 0.0001

scheduler:
  name: linear
  start_epoch: 50
  min_lr: 0.0000001